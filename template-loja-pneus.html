<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  TEMPLATE MESTRE — SITE DE LOJA DE PNEUS
  ==========================================
  Este arquivo é único (HTML + CSS + JS no mesmo arquivo) e serve como
  modelo para várias lojas. Para adaptar a uma nova loja, você só
  precisa editar o objeto CONFIG dentro da tag <script>, no final do
  arquivo (procure por "const CONFIG = {" um pouco depois da abertura
  da tag <script>).

  Tudo que muda de loja pra loja está centralizado ali dentro:
  nome, logo, telefone/WhatsApp, endereço, horário, Instagram,
  cores principais, marcas, serviços, catálogo de pneus e os
  textos da Home.

  Você não precisa (e não deve precisar) tocar no restante do HTML
  ou do CSS para trocar de loja — só o CONFIG.
-->
<title>Loja de Pneus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ======================================================
     CORES: os valores abaixo são os "padrão de fábrica".
     Na prática, quem manda nas cores em tempo de execução é o
     objeto CONFIG.colors (lá no JS) — a função applyTheme()
     escreve essas mesmas variáveis (--bg, --gold, --amber, etc.)
     em tempo real a partir do CONFIG. Os valores aqui só evitam
     um "flash" antes do JS rodar, então mantenha-os iguais ao
     CONFIG.colors padrão.
     ====================================================== */
  :root {
    --bg: #14100B;
    --bg-raised: #1F1912;
    --bg-card: #1B1610;
    --line: #33291C;
    --gold: #C9982F;
    --gold-soft: #A9822E;
    --amber: #F2B705;
    --text: #F3EEE4;
    --text-dim: #9C9284;
    --text-faint: #6B6355;
    --danger-tag: #E4572E;
    --radius: 2px;
    --container: 1180px;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Work Sans', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  img, svg { max-width: 100%; display: block; }
  a { color: inherit; }
  .container {
    max-width: var(--container);
    margin: 0 auto;
    padding: 0 24px;
  }
  h1, h2, h3 {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    letter-spacing: 0.3px;
    margin: 0;
    line-height: 1.05;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'Work Sans', sans-serif;
    font-weight: 700;
    font-size: 15px;
    padding: 14px 26px;
    border-radius: var(--radius);
    border: none;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--amber); color: #14100B; }
  .btn-primary:hover { background: #ffc61a; }
  .btn-outline {
    background: transparent;
    color: var(--text);
    border: 1.5px solid var(--line);
  }
  .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
  .btn-block { width: 100%; justify-content: center; }

  /* ---------- Header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(20, 16, 11, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    gap: 20px;
  }
  .logo {
    font-family: 'Anton', sans-serif;
    font-size: 22px;
    letter-spacing: 0.5px;
    color: var(--text);
  }
  .logo span { color: var(--gold); }
  .logo-lockup { display: flex; align-items: center; gap: 12px; }
  .logo-lockup svg { width: 52px; height: 40px; flex-shrink: 0; }
  .logo-icon { width: 38px; height: 38px; color: var(--gold); flex-shrink: 0; }
  .logo-lockup .logo-text { font-family: 'Anton', sans-serif; font-size: 20px; letter-spacing: 0.3px; line-height: 1.1; }
  .logo-lockup .logo-text em { display: block; font-style: normal; color: var(--gold); font-size: 13px; letter-spacing: 1px; }
  @media (max-width: 480px) { .logo-lockup .logo-text { font-size: 16px; } }
  .header-right {
    display: flex;
    align-items: center;
    gap: 22px;
    font-size: 14px;
    color: var(--text-dim);
  }
  .header-phone { display: flex; align-items: center; gap: 8px; }
  @media (max-width: 720px) {
    .header-phone-text { display: none; }
  }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    overflow: hidden;
    padding: 64px 0 56px;
    background:
      radial-gradient(circle at 78% 30%, rgba(201,152,47,0.14), transparent 55%),
      var(--bg);
  }
  .hero-grid {
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    align-items: center;
    gap: 32px;
  }
  @media (max-width: 900px) {
    .hero-grid { grid-template-columns: 1fr; }
    .hero-art { order: -1; height: 220px; }
  }
  .eyebrow-tag {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    color: var(--gold);
    background: rgba(201,152,47,0.12);
    border: 1px solid rgba(201,152,47,0.35);
    padding: 6px 12px;
    border-radius: var(--radius);
    margin-bottom: 20px;
  }
  .hero h1 {
    font-size: clamp(38px, 5.4vw, 64px);
    color: var(--text);
  }
  .hero h1 em {
    font-style: normal;
    color: var(--gold);
  }
  .hero p.lede {
    color: var(--text-dim);
    font-size: 18px;
    max-width: 46ch;
    margin: 20px 0 32px;
  }

  .search-box {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
  }
  .search-row {
    display: flex;
    gap: 10px;
  }
  .search-row input {
    flex: 1;
    background: var(--bg);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 17px;
    font-family: 'Work Sans', sans-serif;
    padding: 14px 16px;
  }
  .search-row input:focus {
    outline: none;
    border-color: var(--gold);
  }
  .search-row input::placeholder { color: var(--text-faint); }
  .quick-sizes {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }
  .chip {
    font-size: 13px;
    color: var(--text-dim);
    background: var(--bg);
    border: 1px solid var(--line);
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--gold); color: var(--gold); }

  .hero-art {
    position: relative;
    height: 360px;
  }
  .hero-art svg { width: 100%; height: 100%; }

  /* ---------- Results ---------- */
  #results-section { padding: 40px 0 8px; scroll-margin-top: 84px; }
  .results-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }
  .results-header h2 { font-size: 26px; }
  .results-count { color: var(--text-dim); font-size: 14px; }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 24px;
  }
  .filters select {
    background: var(--bg-card);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 12px;
    font-family: 'Work Sans', sans-serif;
    font-size: 14px;
  }

  .tire-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
    margin-bottom: 8px;
  }
  .tire-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
  }
  .tire-card.is-promo { border-color: var(--gold-soft); }
  .promo-tag {
    position: absolute;
    top: 14px;
    right: 14px;
    background: var(--amber);
    color: #14100B;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.4px;
    padding: 4px 8px;
    border-radius: var(--radius);
  }
  .tire-visual {
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #EFE9DA;
    border-radius: 3px;
    padding: 8px;
    overflow: hidden;
  }
  .tire-visual img { height: 100%; width: auto; object-fit: contain; }
  .tire-size {
    font-family: 'Anton', sans-serif;
    font-size: 22px;
    color: var(--text);
  }
  .tire-meta { color: var(--text-dim); font-size: 14px; }
  .tire-brand { color: var(--gold); font-weight: 700; font-size: 13px; letter-spacing: 0.3px; }
  .tire-price {
    font-size: 20px;
    font-weight: 800;
    color: var(--text);
    margin-top: auto;
  }
  .tire-price.unavailable { font-size: 15px; color: var(--text-dim); font-weight: 600; }

  .empty-state {
    text-align: center;
    padding: 56px 20px;
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    color: var(--text-dim);
  }
  .empty-state h3 { font-size: 22px; color: var(--text); margin-bottom: 10px; }
  .empty-state p { margin: 0 0 22px; }

  /* ---------- Promo strip ---------- */
  .section { padding: 64px 0; }
  .section-alt { background: var(--bg-raised); }
  .section-head { max-width: 60ch; margin-bottom: 32px; }
  .section-head h2 { font-size: 30px; margin-bottom: 10px; }
  .section-head p { color: var(--text-dim); font-size: 16px; margin: 0; }

  /* ---------- Brands ---------- */
  .brand-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 3px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  @media (max-width: 700px) {
    .brand-strip { grid-template-columns: repeat(2, 1fr); }
  }
  .brand-tile {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px 14px;
    font-family: 'Anton', sans-serif;
    font-size: 19px;
    letter-spacing: 0.3px;
    transition: transform 0.15s ease;
  }
  .brand-tile:hover { transform: scale(1.02); }

  /* ---------- Services ---------- */
  .services-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
  }
  @media (max-width: 700px) { .services-grid { grid-template-columns: 1fr; } }
  .service-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    padding: 30px;
    border-radius: var(--radius);
  }
  .service-card svg { width: 40px; height: 40px; margin-bottom: 18px; }
  .service-card h3 { font-size: 22px; margin-bottom: 10px; }
  .service-card p { color: var(--text-dim); margin: 0 0 20px; font-size: 15px; }

  /* ---------- About / location ---------- */
  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    align-items: start;
  }
  @media (max-width: 800px) { .about-grid { grid-template-columns: 1fr; } }
  .info-row {
    display: flex;
    gap: 14px;
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
  }
  .info-row:last-child { border-bottom: none; }
  .info-row svg { width: 20px; height: 20px; flex-shrink: 0; margin-top: 2px; color: var(--gold); }
  .info-row .label { font-size: 13px; color: var(--text-faint); margin-bottom: 3px; }
  .info-row .value { font-size: 15px; }
  .map-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    padding: 26px;
    border-radius: var(--radius);
  }

  /* ---------- Final CTA ---------- */
  .final-cta {
    background: linear-gradient(135deg, #1D170F, #14100B 70%);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    text-align: left;
    padding: 72px 0;
  }
  .final-cta h2 { font-size: clamp(28px, 4vw, 44px); max-width: 18ch; margin-bottom: 16px; }
  .final-cta p { color: var(--text-dim); font-size: 17px; max-width: 50ch; margin: 0 0 28px; }

  /* ---------- Footer ---------- */
  footer { padding: 40px 0; }
  .footer-inner {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    color: var(--text-faint);
    font-size: 13px;
    border-top: 1px solid var(--line);
    padding-top: 24px;
  }
  .footer-inner a:hover { color: var(--gold); }

  /* ---------- Floating WhatsApp ---------- */
  .fab {
    position: fixed;
    bottom: 22px;
    right: 22px;
    z-index: 60;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--amber);
    color: #14100B;
    border-radius: 999px;
    padding: 14px 20px 14px 14px;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .fab svg { width: 22px; height: 22px; }
  @media (max-width: 560px) {
    .fab span { display: none; }
    .fab { padding: 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner container">
    <div class="logo-lockup" id="logo-lockup">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M12 3v3.4M12 17.6V21M3 12h3.4M17.6 12H21M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>
      </svg>
      <span class="logo-text" id="logo-text"></span>
    </div>
    <div class="header-right">
      <div class="header-phone">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <span class="header-phone-text" id="header-phone-text"></span>
      </div>
      <a href="#" class="btn btn-primary" id="header-whatsapp">Fale no WhatsApp</a>
    </div>
  </div>
</header>

<section class="hero">
  <div class="container hero-grid">
    <div>
      <span class="eyebrow-tag" id="eyebrow-tag"></span>
      <h1 id="hero-title"></h1>
      <p class="lede" id="hero-lede"></p>

      <div class="search-box">
        <div class="search-row">
          <input type="text" id="search-input" placeholder="Ex: 175/70 R14" autocomplete="off">
          <button class="btn btn-primary" id="search-btn">Buscar</button>
        </div>
        <div class="quick-sizes" id="quick-sizes"></div>
      </div>
    </div>

    <div class="hero-art" aria-hidden="true">
      <svg viewBox="0 0 400 400" fill="none">
        <circle cx="200" cy="200" r="170" stroke="#33291C" stroke-width="2"/>
        <circle cx="200" cy="200" r="170" stroke="#1B1610" stroke-width="40"/>
        <circle cx="200" cy="200" r="170" stroke="#C9982F" stroke-width="2" stroke-dasharray="4 10"/>
        <circle cx="200" cy="200" r="118" fill="#1B1610" stroke="#33291C" stroke-width="2"/>
        <circle cx="200" cy="200" r="78" fill="#14100B" stroke="#C9982F" stroke-width="2"/>
        <circle cx="200" cy="200" r="16" fill="#C9982F"/>
        <g stroke="#33291C" stroke-width="10" stroke-linecap="round">
          <line x1="200" y1="122" x2="200" y2="98"/>
          <line x1="200" y1="278" x2="200" y2="302"/>
          <line x1="122" y1="200" x2="98" y2="200"/>
          <line x1="278" y1="200" x2="302" y2="200"/>
          <line x1="145" y1="145" x2="128" y2="128"/>
          <line x1="255" y1="145" x2="272" y2="128"/>
          <line x1="145" y1="255" x2="128" y2="272"/>
          <line x1="255" y1="255" x2="272" y2="272"/>
        </g>
      </svg>
    </div>
  </div>
</section>

<section id="results-section" class="container">
  <div class="results-header">
    <h2 id="results-title">Pneus em destaque</h2>
    <span class="results-count" id="results-count"></span>
  </div>

  <div class="filters">
    <select id="filter-aro">
      <option value="">Aro (todos)</option>
    </select>
    <select id="filter-marca">
      <option value="">Marca (todas)</option>
    </select>
    <button class="btn btn-outline" id="clear-filters" style="display:none;">Limpar busca</button>
  </div>

  <div class="tire-grid" id="tire-grid"></div>
  <div class="empty-state" id="empty-state" style="display:none;">
    <h3 id="empty-title"></h3>
    <p id="empty-text"></p>
    <a href="#" class="btn btn-primary" id="empty-whatsapp">Consultar no WhatsApp</a>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="section-head">
      <h2 id="services-title"></h2>
      <p id="services-subtitle"></p>
    </div>
    <div class="services-grid" id="services-grid"></div>
  </div>
</section>

<section class="section section-alt">
  <div class="container about-grid">
    <div>
      <div class="section-head">
        <h2 id="about-title"></h2>
        <p id="about-subtitle"></p>
      </div>
      <div class="info-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <div><div class="label">Endereço</div><div class="value" id="info-address"></div></div>
      </div>
      <div class="info-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        <div><div class="label">Horário</div><div class="value" id="info-hours"></div></div>
      </div>
      <div class="info-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <div><div class="label">Telefone / WhatsApp</div><div class="value" id="info-phone"></div></div>
      </div>
      <div class="info-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
        <div><div class="label">Instagram</div><div class="value" id="info-instagram"></div></div>
      </div>
    </div>
    <div class="map-card">
      <p style="color:var(--text-dim); font-size:14px; margin:0 0 16px;" id="map-cta-text"></p>
      <a href="#" target="_blank" rel="noopener" class="btn btn-outline btn-block" id="map-cta-btn"></a>
    </div>
  </div>
</section>

<section class="final-cta">
  <div class="container">
    <h2 id="cta-title"></h2>
    <p id="cta-subtitle"></p>
    <a href="#" class="btn btn-primary" id="final-whatsapp"></a>
  </div>
</section>

<section class="section section-alt" style="padding-bottom: 0;">
  <div class="container" style="padding-bottom: 0;">
    <div class="section-head">
      <h2 id="brands-title"></h2>
      <p id="brands-subtitle"></p>
    </div>
  </div>
  <div class="brand-strip" id="brand-row"></div>
</section>

<footer>
  <div class="container footer-inner">
    <span id="footer-text"></span>
    <span><a id="footer-instagram-link" target="_blank" rel="noopener"></a> · <span id="footer-phone"></span></span>
  </div>

// Ícones genéricos usados nos cards de serviço (chaveados por CONFIG.services[].icon)
const SERVICE_ICONS = {
  alinhamento: '<svg viewBox="0 0 24 24" fill="none" stroke="#C9982F" stroke-width="1.6"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5z"/><path d="M12 12 3 7"/><path d="M12 12v10"/><path d="M12 12l9-5"/></svg>',
  balanceamento: '<svg viewBox="0 0 24 24" fill="none" stroke="#C9982F" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>',
  generico: '<svg viewBox="0 0 24 24" fill="none" stroke="#C9982F" stroke-width="1.6"><path d="M20 6 9 17l-5-5"/></svg>'
};

function withStore(str) {
  return str.split("{store}").join(CONFIG.store.name);
}

function waLink(message) {
  return `https://wa.me/${CONFIG.contact.whatsappNumber}?text=${encodeURIComponent(message)}`;
}

function formatPrice(v) {
  return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function normalizeSize(str) {
  return str.toLowerCase().replace(/\s+/g, "").replace(/[-]/g, "");
}

// ---- Aplica as cores do CONFIG nas variáveis de CSS ------------------------
function applyTheme(colors) {
  const root = document.documentElement.style;
  root.setProperty('--bg', colors.bg);
  root.setProperty('--bg-raised', colors.bgRaised);
  root.setProperty('--bg-card', colors.bgCard);
  root.setProperty('--line', colors.line);
  root.setProperty('--gold', colors.primary);
  root.setProperty('--gold-soft', colors.primarySoft);
  root.setProperty('--amber', colors.accent);
  root.setProperty('--text', colors.text);
  root.setProperty('--text-dim', colors.textDim);
  root.setProperty('--text-faint', colors.textFaint);
}

// ---- Preenche cabeçalho, hero, textos fixos da Home a partir do CONFIG ------
function renderStaticContent() {
  document.title = `${CONFIG.store.name} — Pneus e serviços automotivos`;

  // Logo: imagem própria (se houver) ou ícone + nome em texto
  const logoWrap = document.getElementById("logo-lockup");
  if (CONFIG.store.logoImageUrl) {
    logoWrap.innerHTML = `<img src="${CONFIG.store.logoImageUrl}" alt="${CONFIG.store.name}" style="height:38px;width:auto;">`;
  } else {
    document.getElementById("logo-text").innerHTML =
      CONFIG.store.name + (CONFIG.store.tagline ? `<em>${CONFIG.store.tagline}</em>` : "");
  }

  document.getElementById("header-phone-text").textContent = CONFIG.contact.phoneDisplay;
  document.getElementById("eyebrow-tag").textContent = CONFIG.home.eyebrowText;
  document.getElementById("hero-title").innerHTML = CONFIG.home.heroTitleHtml;
  document.getElementById("hero-lede").textContent = CONFIG.home.heroLede;

  document.getElementById("empty-title").textContent = CONFIG.home.emptyTitle;
  document.getElementById("empty-text").textContent = CONFIG.home.emptyText;

  document.getElementById("services-title").textContent = CONFIG.home.servicesTitle;
  document.getElementById("services-subtitle").textContent = CONFIG.home.servicesSubtitle;

  document.getElementById("about-title").textContent = CONFIG.home.aboutTitle;
  document.getElementById("about-subtitle").textContent = CONFIG.home.aboutSubtitle;
  document.getElementById("info-address").textContent = CONFIG.address.street;
  document.getElementById("info-hours").textContent = CONFIG.hours;
  document.getElementById("info-phone").textContent = CONFIG.contact.phoneDisplay;
  document.getElementById("info-instagram").textContent = CONFIG.contact.instagramHandle;

  const mapsUrl = CONFIG.address.mapsUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(CONFIG.address.street)}`;
  document.getElementById("map-cta-text").textContent = CONFIG.home.mapsCtaText;
  const mapBtn = document.getElementById("map-cta-btn");
  mapBtn.href = mapsUrl;
  mapBtn.textContent = CONFIG.home.mapsCtaLabel;

  document.getElementById("cta-title").textContent = CONFIG.home.ctaTitle;
  document.getElementById("cta-subtitle").textContent = CONFIG.home.ctaSubtitle;
  document.getElementById("final-whatsapp").textContent = CONFIG.home.ctaButtonLabel;

  document.getElementById("brands-title").textContent = CONFIG.home.brandsTitle;
  document.getElementById("brands-subtitle").textContent = CONFIG.home.brandsSubtitle;

  document.getElementById("footer-text").textContent = `${CONFIG.store.name} — ${CONFIG.address.street}`;
  const footerIg = document.getElementById("footer-instagram-link");
  footerIg.href = CONFIG.contact.instagramUrl;
  footerIg.textContent = CONFIG.contact.instagramHandle;
  document.getElementById("footer-phone").textContent = CONFIG.contact.phoneDisplay;

  // Botões de WhatsApp genéricos (cabeçalho, CTA final, botão flutuante)
  const genericMsg = waLink(withStore(CONFIG.home.whatsappGenericMessage));
  ["header-whatsapp", "final-whatsapp", "fab-whatsapp"].forEach(id => {
    const el = document.getElementById(id);
    el.href = genericMsg;
    el.target = "_blank";
    el.rel = "noopener";
  });
}

// ---- Renderiza a grade de serviços a partir do CONFIG.services --------------
function renderServices() {
  const wrap = document.getElementById("services-grid");
  wrap.innerHTML = CONFIG.services.map(svc => {
    const icon = SERVICE_ICONS[svc.icon] || SERVICE_ICONS.generico;
    const msg = waLink(withStore(CONFIG.home.whatsappServiceMessage.replace("{servico}", svc.name.toLowerCase())));
    return `
      <div class="service-card">
        ${icon}
        <h3>${svc.name}</h3>
        <p>${svc.description}</p>
        <a href="${msg}" target="_blank" rel="noopener" class="btn btn-outline">Agendar pelo WhatsApp</a>
      </div>
    `;
  }).join("");
}

// ---- Renderiza a faixa de marcas a partir do CONFIG.brands -------------------
function renderBrands() {
  const wrap = document.getElementById("brand-row");
  wrap.innerHTML = CONFIG.brands.map(b => {
    const bg = b.bg || "var(--bg-card)";
    const color = b.color || "var(--gold)";
    const style = `background:${bg};color:${color};${b.italic ? "font-style:italic;" : ""}`;
    return `<div class="brand-tile" style="${style}">${b.name}</div>`;
  }).join("");
}

// ---- Catálogo de pneus (busca, filtros, resultados) ---------------------------
function tireCardHTML(tire) {
  const priceHTML = tire.price
    ? `<div class="tire-price">${formatPrice(tire.price)}</div>`
    : `<div class="tire-price unavailable">Consultar preço</div>`;
  const cta = tire.price
    ? { label: "Comprar pelo WhatsApp", msg: withStore(CONFIG.home.whatsappBuyMessage).replace("{medida}", tire.size).replace("{marca}", tire.brand).replace("{modelo}", tire.model) }
    : { label: "Consultar disponibilidade", msg: withStore(CONFIG.home.whatsappCheckMessage).replace("{medida}", tire.size).replace("{marca}", tire.brand).replace("{modelo}", tire.model) };
  const img = tire.image || DEFAULT_TIRE_IMAGE;

  return `
    <div class="tire-card ${tire.promo ? 'is-promo' : ''}">
      ${tire.promo ? '<span class="promo-tag">OFERTA</span>' : ''}
      <div class="tire-visual">
        <img src="${img}" alt="${tire.brand} ${tire.model}">
      </div>
      <div>
        <div class="tire-brand">${tire.brand}</div>
        <div class="tire-size">${tire.size}</div>
        <div class="tire-meta">${tire.model} · Aro ${tire.aro}</div>
      </div>
      ${priceHTML}
      <a href="${waLink(cta.msg)}" target="_blank" rel="noopener" class="btn btn-primary btn-block">${cta.label}</a>
    </div>
  `;
}

function populateFilters() {
  const aros = [...new Set(CONFIG.tires.map(t => t.aro))].sort((a, b) => a - b);
  const marcas = [...new Set(CONFIG.tires.map(t => t.brand))].sort();
  const aroSelect = document.getElementById("filter-aro");
  const marcaSelect = document.getElementById("filter-marca");
  aros.forEach(a => {
    const opt = document.createElement("option");
    opt.value = a; opt.textContent = `Aro ${a}`;
    aroSelect.appendChild(opt);
  });
  marcas.forEach(m => {
    const opt = document.createElement("option");
    opt.value = m; opt.textContent = m;
    marcaSelect.appendChild(opt);
  });
}

function populateQuickSizes() {
  const wrap = document.getElementById("quick-sizes");
  CONFIG.quickSizes.forEach(size => {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.type = "button";
    chip.textContent = size;
    chip.addEventListener("click", () => {
      document.getElementById("search-input").value = size;
      runSearch();
    });
    wrap.appendChild(chip);
  });
}

function renderResults(list, opts = {}) {
  const grid = document.getElementById("tire-grid");
  const empty = document.getElementById("empty-state");
  const count = document.getElementById("results-count");
  const title = document.getElementById("results-title");

  title.textContent = opts.title || CONFIG.home.featuredTitle;
  count.textContent = list.length ? `${list.length} pneu${list.length > 1 ? "s" : ""} encontrado${list.length > 1 ? "s" : ""}` : "";

  if (!list.length) {
    grid.style.display = "none";
    empty.style.display = "block";
    const emptyMsg = opts.query
      ? withStore(CONFIG.home.whatsappEmptyMessage).replace("{medida}", opts.query)
      : withStore(CONFIG.home.whatsappGenericMessage);
    document.getElementById("empty-whatsapp").href = waLink(emptyMsg);
    return;
  }
  empty.style.display = "none";
  grid.style.display = "grid";
  grid.innerHTML = list.map(tireCardHTML).join("");
}

function applyFilters(base) {
  const aro = document.getElementById("filter-aro").value;
  const marca = document.getElementById("filter-marca").value;
  return base.filter(t =>
    (!aro || String(t.aro) === aro) &&
    (!marca || t.brand === marca)
  );
}

function runSearch() {
  const raw = document.getElementById("search-input").value.trim();
  const clearBtn = document.getElementById("clear-filters");

  if (!raw) {
    clearBtn.style.display = (document.getElementById("filter-aro").value || document.getElementById("filter-marca").value) ? "inline-flex" : "none";
    renderResults(applyFilters(CONFIG.tires), { title: CONFIG.home.featuredTitle });
    return;
  }

  const query = normalizeSize(raw);
  let matches = CONFIG.tires.filter(t => normalizeSize(t.size).includes(query));
  matches = applyFilters(matches);
  clearBtn.style.display = "inline-flex";
  renderResults(matches, { title: `Resultado para "${raw}"`, query: raw });
  document.getElementById("results-section").scrollIntoView({ behavior: "smooth", block: "start" });
}

document.getElementById("search-btn").addEventListener("click", runSearch);
document.getElementById("search-input").addEventListener("keydown", e => {
  if (e.key === "Enter") runSearch();
});
document.getElementById("filter-aro").addEventListener("change", runSearch);
document.getElementById("filter-marca").addEventListener("change", runSearch);
document.getElementById("clear-filters").addEventListener("click", () => {
  document.getElementById("search-input").value = "";
  document.getElementById("filter-aro").value = "";
  document.getElementById("filter-marca").value = "";
  runSearch();
});

// ---- Inicialização --------------------------------------------------------
applyTheme(CONFIG.colors);
renderStaticContent();
renderServices();
renderBrands();
